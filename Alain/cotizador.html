<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1258a2">
<title>cotizacionesJT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="cotizacionesJT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --blue:#1258a2; --blue-dark:#0e4684; --red:#eb2e2f;
  --ink:#1c2433; --mute:#667085; --line:#dbe1ec; --soft:#eef3fb; --soft-red:#fdeeed;
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.4 var(--font);padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.topband{height:8px;background:linear-gradient(90deg,var(--blue) 0 78%,var(--red) 78% 100%)}
header.app{padding:20px 18px 8px}
header.app small{display:block;color:var(--red);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
header.app h1{margin:2px 0 0;font-size:26px;line-height:1.15;color:var(--blue)}
main{padding:0 18px;max-width:640px;margin:0 auto}
section.blk{padding:22px 0 6px;border-top:1px solid var(--line);margin-top:18px}
section.blk:first-of-type{border-top:0;margin-top:6px}
h2{margin:0 0 14px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 6px}
.f{margin-bottom:14px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;min-height:50px;appearance:none;-webkit-appearance:none}
textarea{resize:vertical;min-height:84px;line-height:1.4}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #1258a226}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2.num{grid-template-columns:1fr 1.4fr}
.item{padding:14px 0 6px;border-bottom:1px solid var(--line)}
.item:first-child{padding-top:0}
.item-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.item-h b{font-size:13px;color:var(--mute)}
.link{background:none;border:0;color:var(--red);font:inherit;font-size:14px;font-weight:600;padding:10px 4px;min-height:44px;cursor:pointer}
.amount{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 14px;font-size:14px;color:var(--mute)}
.amount b{color:var(--ink);font-size:17px}
.add{width:100%;min-height:52px;margin:16px 0 8px;background:#fff;border:1.5px dashed var(--blue);color:var(--blue);border-radius:12px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
details{margin:18px 0 0;border-top:1px solid var(--line);padding-top:6px}
summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--blue)}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";font-size:20px;letter-spacing:0}
details[open] summary::after{content:"－"}
.logo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo-row img{height:56px;max-width:140px;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
.btn{font:inherit;font-weight:700;font-size:16px;min-height:54px;padding:0 18px;border-radius:12px;border:1.5px solid var(--blue);cursor:pointer;transition:transform .12s cubic-bezier(.23,1,.32,1),background-color .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:active{background:var(--blue-dark)}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.small{min-height:44px;font-size:14px;padding:0 14px}
.btn[hidden]{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:640px;margin:0 auto}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.total span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.total b{font-size:22px;color:var(--blue)}
.actions{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
/* vista previa / resultado */
#pv{position:fixed;inset:0;background:#e6eaf1;z-index:10;display:flex;flex-direction:column}
#pv[hidden]{display:none}
.pv-top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#fff;border-bottom:1px solid var(--line)}
.pv-top b{flex:1;font-size:15px}
.pv-body{flex:1;overflow:auto;padding:14px 12px 20px;-webkit-overflow-scrolling:touch}
.pv-body canvas{display:block;width:100%;max-width:640px;height:auto;margin:0 auto 14px;background:#fff;box-shadow:0 1px 3px #1c24331f,0 8px 24px #1c243314}
.pv-bar{background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.pv-bar .in{max-width:640px;margin:0 auto}
.pv-msg{font-size:14px;margin:0 0 10px;color:var(--ink)}
.pv-msg b{color:var(--blue)}
.pv-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv-acts.one{grid-template-columns:1fr}
.newq{display:block;width:100%;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
/* cotizaciones anteriores */
.hist-btn{margin-top:12px;min-height:44px;font-size:14px}
#hist{position:fixed;inset:0;background:#fff;z-index:9;display:flex;flex-direction:column}
#hist .pv-body{background:#fff;padding:14px 16px 24px}
#hist .in{max-width:640px;margin:0 auto}
.hi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--soft)}
.hi b.t{display:block;font-size:16px;word-break:break-word}
.hi .m{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:4px 0 10px}
.hi .m i{font-style:normal;color:var(--blue);font-weight:700}
.hi .a{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.hi .a .btn{min-height:44px;font-size:14px;padding:0 10px}
.hist-empty{color:var(--mute);text-align:center;padding:40px 10px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="topband"></div>
<header class="app">
  <small>jtclimatizacion &amp; electricidad</small>
  <h1>Nueva cotización</h1>
  <button class="btn ghost small hist-btn" id="btnHist" type="button">Cotizaciones anteriores</button>
</header>

<main>
  <section class="blk">
    <div class="row2 num">
      <div class="f"><label for="num">N° de cotización</label><input id="num" inputmode="numeric" autocomplete="off"></div>
      <div class="f"><label for="date">Fecha</label><input id="date" type="date"></div>
    </div>
    <div class="f"><label for="client">Cliente</label><input id="client" autocomplete="off" placeholder="Nombre del cliente"></div>
  </section>

  <section class="blk">
    <h2>Ítems</h2>
    <div id="items"></div>
    <button class="add" id="add" type="button">+ Agregar ítem</button>
  </section>

  <section class="blk">
    <h2>Observaciones</h2>
    <div class="f"><textarea id="obs" placeholder="Garantía, alcance del trabajo, condiciones…"></textarea></div>
  </section>

  <details>
    <summary>Pie y condiciones</summary>
    <div class="f"><label for="pay">Forma de pago</label><input id="pay" autocomplete="off"></div>
    <div class="f"><label for="valid">Validez</label><input id="valid" autocomplete="off"></div>
    <div class="f"><label for="wa">WhatsApp (pie de página)</label><input id="wa" inputmode="tel" autocomplete="off"></div>
    <div class="f"><label for="ig">Instagram (vacío = no se muestra)</label><input id="ig" autocomplete="off" placeholder="@usuario"></div>
    <div class="f">
      <label>Logo</label>
      <div class="logo-row">
        <img id="logoPrev" alt="" hidden>
        <input id="logoFile" type="file" accept="image/*" hidden>
        <button class="btn ghost small" id="logoBtn" type="button">Cargar logo</button>
        <button class="link" id="logoDel" type="button" hidden>Quitar</button>
      </div>
    </div>
  </details>
</main>

<div class="bar">
  <div class="in">
    <div class="total"><span>Total</span><b id="totalLive">$ 0,00</b></div>
    <div class="actions">
      <button class="btn ghost" id="btnPreview" type="button">Vista previa</button>
      <button class="btn primary" id="btnGen" type="button">Generar PDF</button>
    </div>
  </div>
</div>

<div id="pv" hidden>
  <div class="pv-top"><button class="btn ghost small" id="pvBack" type="button">← Volver</button><b id="pvTitle">Vista previa</b></div>
  <div class="pv-body" id="pvBody"></div>
  <div class="pv-bar"><div class="in">
    <p class="pv-msg" id="pvMsg" hidden></p>
    <div class="pv-acts one" id="actsPreview"><button class="btn primary" id="pvGen" type="button">Generar PDF</button></div>
    <div class="pv-acts" id="actsDone" hidden>
      <button class="btn primary" id="btnDl" type="button">Descargar</button>
      <button class="btn primary" id="btnShare" type="button">Compartir</button>
    </div>
    <button class="btn primary newq" id="btnNew" type="button" hidden>Crear nueva cotización</button>
  </div></div>
</div>

<div id="hist" hidden>
  <div class="pv-top"><button class="btn ghost small" id="histBack" type="button">← Volver</button><b>Cotizaciones anteriores</b></div>
  <div class="pv-body"><div class="in">
    <div class="f"><input id="histQ" type="search" placeholder="Buscar por cliente o fecha" autocomplete="off"></div>
    <div id="histList"></div>
  </div></div>
</div>

<div id="toast" hidden role="status"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const pad = n => String(n).padStart(6, "0");
function parseNum(s){
  s = String(s == null ? "" : s).trim().replace(/[^\d.,-]/g, "");
  if(!s) return 0;
  if(s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else { const m = s.match(/\./g); if(m && (m.length > 1 || /\.\d{3}$/.test(s))) s = s.replace(/\./g, ""); }
  return parseFloat(s) || 0;
}
function fmtNum(n, dec){
  const neg = n < 0; n = Math.abs(n);
  let [i, d] = n.toFixed(dec).split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (neg ? "-" : "") + i + (dec ? "," + d : "");
}
const money = n => "$ " + fmtNum(n, 2);
const qtyFmt = n => fmtNum(n, Number.isInteger(n) ? 0 : 2).replace(/,00$/, "");
function isoToAr(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; }
function todayIso(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ---------- estado del formulario ---------- */
let items = [{ desc: "", qty: "1", price: "" }];
const lineAmount = it => (parseNum(it.qty) || 0) * parseNum(it.price);
const grandTotal = () => items.reduce((a, it) => a + lineAmount(it), 0);

function renderItems(){
  const box = $("#items"); box.innerHTML = "";
  items.forEach((it, i) => {
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `
      <div class="item-h"><b>Ítem ${i + 1}</b>${items.length > 1 ? '<button class="link" type="button" data-del>Quitar</button>' : ""}</div>
      <div class="f"><label>Descripción</label><textarea data-k="desc" placeholder="Qué se hace o se vende"></textarea></div>
      <div class="row2">
        <div class="f"><label>Cantidad</label><input data-k="qty" inputmode="decimal" autocomplete="off"></div>
        <div class="f"><label>Precio unitario</label><input data-k="price" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
      </div>
      <div class="amount"><span>Importe</span><b data-amt></b></div>`;
    el.querySelectorAll("[data-k]").forEach(inp => {
      inp.value = it[inp.dataset.k];
      inp.addEventListener("input", () => { it[inp.dataset.k] = inp.value; refreshTotals(); });
    });
    const del = el.querySelector("[data-del]");
    if(del) del.addEventListener("click", () => { items.splice(i, 1); renderItems(); });
    box.appendChild(el);
  });
  refreshTotals();
}
function refreshTotals(){
  document.querySelectorAll("#items .item").forEach((el, i) => { el.querySelector("[data-amt]").textContent = money(lineAmount(items[i])); });
  $("#totalLive").textContent = money(grandTotal());
}
$("#add").addEventListener("click", () => {
  items.push({ desc: "", qty: "1", price: "" }); renderItems();
  const last = document.querySelectorAll("#items textarea"); last[last.length - 1].focus();
});

/* ---------- configuración persistente ---------- */
const CFG = { wa: "+54 9 11 6250-7088", ig: "@jtclimatizacion", pay: "Efectivo/transferencia", valid: "3 días" };
for(const k of Object.keys(CFG)){
  const inp = $("#" + k); inp.value = store.get("jt_" + k, CFG[k]);
  inp.addEventListener("input", () => store.set("jt_" + k, inp.value));
}
/* la fecha sigue al día actual salvo que se la cambie a mano */
let dateTouched = false;
function refreshDate(){ if(!dateTouched) $("#date").value = todayIso(); }
$("#date").addEventListener("change", () => { dateTouched = $("#date").value !== todayIso(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden) refreshDate(); });
refreshDate();
const savedNext = parseInt(store.get("jt_next", "0"), 10);
$("#num").value = pad(savedNext >= 0 ? savedNext : 0);
$("#num").addEventListener("change", () => {
  const n = parseInt($("#num").value.replace(/\D/g, ""), 10);
  $("#num").value = pad(n >= 0 ? n : 0);
});

let logoUrl = store.get("jt_logo", "");
function showLogo(){
  $("#logoPrev").src = logoUrl || DEFAULT_LOGO; $("#logoPrev").hidden = false;
  $("#logoDel").hidden = !logoUrl; $("#logoDel").textContent = "Volver al original";
  $("#logoBtn").textContent = "Cambiar logo";
}
$("#logoBtn").addEventListener("click", () => $("#logoFile").click());
$("#logoDel").addEventListener("click", () => { logoUrl = ""; store.del("jt_logo"); logoImg = null; showLogo(); });
$("#logoFile").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 700 / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      logoUrl = c.toDataURL("image/png"); store.set("jt_logo", logoUrl); logoImg = null; showLogo();
    };
    im.onerror = () => toast("No se pudo leer esa imagen.");
    im.src = fr.result;
  };
  fr.readAsDataURL(f); e.target.value = "";
});
showLogo();
let logoImg = null;
function getLogo(){
  if(logoImg) return Promise.resolve(logoImg);
  return new Promise(res => { const im = new Image(); im.onload = () => res(logoImg = im); im.onerror = () => res(null); im.src = logoUrl || DEFAULT_LOGO; });
}

function rr(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function spaced(ctx, v){ try { ctx.letterSpacing = v; } catch(e){} }
function wrap(ctx, text, maxW){
  const out = [];
  for(const para of String(text).split(/\r?\n/)){
    if(!para.trim()){ out.push(""); continue; }
    let line = "";
    for(const word of para.trim().split(/\s+/)){
      const t = line ? line + " " + word : word;
      if(ctx.measureText(t).width <= maxW){ line = t; continue; }
      if(line) out.push(line);
      line = word;
      while(ctx.measureText(line).width > maxW){
        let i = line.length - 1; while(i > 1 && ctx.measureText(line.slice(0, i)).width > maxW) i--;
        out.push(line.slice(0, i)); line = line.slice(i);
      }
    }
    out.push(line);
  }
  return out;
}
function drawIcon(ctx, d, x, y, size, fill){
  ctx.save(); ctx.translate(x, y); ctx.scale(size / 24, size / 24); ctx.fillStyle = fill; ctx.fill(new Path2D(d)); ctx.restore();
}
function igGradient(ctx, x, y, s){
  const g = ctx.createLinearGradient(x, y + s, x + s, y);
  [[0, "#FEDA75"], [.25, "#FA7E1E"], [.5, "#D62976"], [.75, "#962FBF"], [1, "#4F5BD5"]].forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}

function waUrl(s){ const n = String(s).replace(/\D/g, ""); return n ? "https://wa.me/" + n : ""; }
function igUrl(s){
  const m = /instagram\.com\/([^/?#\s]+)/i.exec(s); const u = (m ? m[1] : String(s).trim().replace(/^@/, "")).replace(/[^\w.]/g, "");
  return u ? "https://www.instagram.com/" + u + "/" : "";
}

async function renderDoc(d){
  const logo = await getLogo();
  const pages = []; let ctx, y;
  const band = () => { ctx.fillStyle = C.blue; ctx.fillRect(0, 0, W, 9); ctx.fillStyle = C.red; ctx.fillRect(W * .78, 0, W * .22, 9); };
  const newPage = cont => {
    const cv = document.createElement("canvas"); cv.width = W * S; cv.height = H * S;
    ctx = cv.getContext("2d"); ctx.scale(S, S); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "alphabetic"; pages.push({ cv, ctx }); band();
    if(cont){
      ctx.fillStyle = C.blue; ctx.font = font(700, 14); ctx.textAlign = "left"; ctx.fillText("jtclimatizacion & electricidad", M, 42);
      ctx.fillStyle = C.mute; ctx.font = font(600, 13); ctx.textAlign = "right"; ctx.fillText("Cotización N° " + d.num, W - M, 42);
      ctx.fillStyle = C.line; ctx.fillRect(M, 54, CW, 1); y = 74;
    }
  };
  const tableHead = () => {
    ctx.textAlign = "left"; ctx.fillStyle = C.mute; ctx.font = font(700, 11); spaced(ctx, "1.2px");
    ctx.fillText("DESCRIPCIÓN", M, y + 12);
    ctx.textAlign = "center"; ctx.fillText("CANT.", 548, y + 12);
    ctx.textAlign = "right"; ctx.fillText("IMPORTE", W - M, y + 12); spaced(ctx, "0px");
    ctx.fillStyle = C.blue; ctx.fillRect(M, y + 22, CW, 2); y += 24;
  };

  /* --- página 1: encabezado --- */
  newPage(false);
  let lw = 76, lh = 76;
  if(logo){ const k = Math.min(150 / logo.width, 92 / logo.height); lw = logo.width * k; lh = logo.height * k; ctx.drawImage(logo, M, 28 + (92 - lh) / 2, lw, lh); }
  else {
    ctx.fillStyle = C.blue; rr(ctx, M, 34, 76, 76, 14); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = font(800, 30); ctx.textAlign = "center"; ctx.fillText("JT", M + 38, 82);
    ctx.fillStyle = C.red; ctx.fillRect(M + 18, 92, 40, 5);
  }
  const tx = M + lw + 18; ctx.textAlign = "left";
  ctx.fillStyle = C.blue; ctx.font = font(800, 19); ctx.fillText("jtclimatizacion & electricidad", tx, 56);
  const info = [["Tel:", "11 6250-7088"], ["Mail:", "jtclimatizacion@gmail.com"], ["Zona:", "Capital"]];
  info.forEach(([k, v], i) => {
    const yy = 80 + i * 21; ctx.font = font(700, 14); ctx.fillStyle = C.ink; ctx.fillText(k, tx, yy);
    const kw = ctx.measureText(k + " ").width; ctx.font = font(400, 14); ctx.fillStyle = C.mute; ctx.fillText(v, tx + kw, yy);
  });
  ctx.textAlign = "right"; ctx.fillStyle = C.red; ctx.font = font(700, 12); spaced(ctx, "2px"); ctx.fillText("COTIZACIÓN", W - M, 52); spaced(ctx, "0px");
  ctx.fillStyle = C.blue; ctx.font = font(800, 30); ctx.fillText("N° " + d.num, W - M, 86);
  ctx.fillStyle = C.mute; ctx.font = font(500, 14); ctx.fillText("Fecha: " + d.date, W - M, 110);

  /* --- cliente --- */
  y = 140; ctx.textAlign = "left"; ctx.font = font(700, 19);
  const cl = wrap(ctx, d.client || "—", CW - 40); const ch = 40 + cl.length * 25;
  ctx.fillStyle = C.soft; rr(ctx, M, y, CW, ch, 10); ctx.fill();
  ctx.fillStyle = C.blue; ctx.font = font(700, 11); spaced(ctx, "1.5px"); ctx.fillText("CLIENTE", M + 20, y + 22); spaced(ctx, "0px");
  ctx.fillStyle = C.ink; ctx.font = font(700, 19); cl.forEach((t, i) => ctx.fillText(t, M + 20, y + 48 + i * 25));
  y += ch + 26;

  /* --- ítems --- */
  tableHead();
  for(const it of d.items){
    ctx.font = font(600, 15);
    const lines = wrap(ctx, it.desc || "(sin descripción)", 400);
    const h = 16 + lines.length * 20 + 22;
    if(y + h > LIMIT){ newPage(true); tableHead(); }
    ctx.textAlign = "left"; ctx.fillStyle = C.ink; ctx.font = font(600, 15);
    lines.forEach((t, i) => ctx.fillText(t, M, y + 28 + i * 20));
    ctx.fillStyle = C.mute; ctx.font = font(400, 12); ctx.fillText("PU " + money(parseNum(it.price)), M, y + 28 + lines.length * 20 + 2);
    ctx.fillStyle = C.ink; ctx.font = font(600, 15); ctx.textAlign = "center"; ctx.fillText(qtyFmt(parseNum(it.qty)), 548, y + 28);
    ctx.textAlign = "right"; ctx.font = font(700, 15); ctx.fillText(money(lineAmount(it)), W - M, y + 28);
    y += h; ctx.fillStyle = C.line; ctx.fillRect(M, y, CW, 1);
  }

  /* --- total --- */
  const cond = [d.pay && "Forma de pago: " + d.pay, d.valid && "Validez: " + d.valid].filter(Boolean).join("   ·   ");
  y += 30;
  if(y + 56 + (cond ? 30 : 0) > LIMIT){ newPage(true); }
  ctx.fillStyle = C.blue; rr(ctx, M, y, CW, 56, 10); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.font = font(700, 13); spaced(ctx, "2px"); ctx.fillText("TOTAL", M + 22, y + 34); spaced(ctx, "0px");
  ctx.textAlign = "right"; ctx.font = font(800, 25); ctx.fillText(money(d.total), W - M - 22, y + 37);
  y += 56;
  if(cond){ ctx.textAlign = "left"; ctx.fillStyle = C.mute; ctx.font = font(500, 13); ctx.fillText(cond, M, y + 24); y += 30; }

  /* --- observaciones --- */
  if(d.obs.trim()){
    y += 22; ctx.font = font(400, 14.5);
    const lines = wrap(ctx, d.obs, CW - 50); let idx = 0, first = true; const LH = 21;
    while(idx < lines.length){
      const headH = first ? 46 : 18;
      if(LIMIT - y < headH + LH + 16){ newPage(true); first = true; continue; }
      const fit = Math.max(1, Math.floor((LIMIT - y - headH - 16) / LH));
      const chunk = lines.slice(idx, idx + fit); const bh = headH + chunk.length * LH + 16;
      ctx.fillStyle = C.softRed; ctx.fillRect(M, y, CW, bh); ctx.fillStyle = C.red; ctx.fillRect(M, y, 6, bh);
      if(first){ ctx.textAlign = "left"; ctx.fillStyle = C.red; ctx.font = font(800, 12); spaced(ctx, "1.8px"); ctx.fillText("OBSERVACIONES", M + 26, y + 28); spaced(ctx, "0px"); }
      ctx.textAlign = "left"; ctx.fillStyle = C.ink; ctx.font = font(400, 14.5);
      chunk.forEach((t, i) => ctx.fillText(t, M + 26, y + headH + 8 + i * LH));
      y += bh; idx += chunk.length; first = false;
      if(idx < lines.length) newPage(true);
    }
  }

  /* --- pie en todas las páginas --- */
  pages.forEach((p, n) => {
    const c = p.ctx, y0 = H - 90;
    c.fillStyle = C.line; c.fillRect(M, y0, CW, 1);
    const parts = []; c.font = font(600, 14);
    if(d.wa.trim()) parts.push({ k: "wa", t: d.wa.trim() });
    if(d.ig.trim()) parts.push({ k: "ig", t: d.ig.trim() });
    parts.forEach(q => q.w = 24 + 9 + c.measureText(q.t).width);
    const total = parts.reduce((a, q) => a + q.w, 0) + 40 * Math.max(0, parts.length - 1);
    let x = (W - total) / 2; p.cv.links = [];
    parts.forEach(q => {
      const url = q.k === "wa" ? waUrl(q.t) : igUrl(q.t);
      if(url) p.cv.links.push({ x: x - 6, y: y0 + 11, w: q.w + 12, h: 34, url });
      if(q.k === "wa") drawIcon(c, ICON_WA, x, y0 + 17, 24, "#25D366");
      else drawIcon(c, ICON_IG, x, y0 + 17, 24, igGradient(c, x, y0 + 17, 24));
      c.fillStyle = C.ink; c.font = font(600, 14); c.textAlign = "left"; c.fillText(q.t, x + 33, y0 + 34); x += q.w + 40;
    });
    c.fillStyle = C.mute; c.font = font(400, 11.5); c.textAlign = "center";
    c.fillText(`© ${new Date().getFullYear()} jtclimatizacion & electricidad · Todos los derechos reservados`, W / 2, y0 + 70);
    if(pages.length > 1){ c.textAlign = "right"; c.fillText(`${n + 1}/${pages.length}`, W - M, y0 + 70); }
  });
  return pages.map(p => p.cv);
}

/* ---------- PDF (imágenes JPEG, sin librerías) ---------- */
function buildPdf(jpegs){
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = x => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = n => { offs[n] = len; push(`${n} 0 obj\n`); };
  const n = jpegs.length, PW = 595.28, PH = 841.89;
  let nextAnnot = 3 + 3 * n; const annotIds = jpegs.map(j => (j.links || []).map(() => nextAnnot++));
  push("%PDF-1.4\n%âãÏÓ\n");
  obj(1); push("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  obj(2); push(`<< /Type /Pages /Count ${n} /Kids [${jpegs.map((_, i) => `${3 + 3 * i} 0 R`).join(" ")}] >>\nendobj\n`);
  jpegs.forEach((j, i) => {
    const p = 3 + 3 * i, c = p + 1, im = p + 2;
    const an = annotIds[i].length ? ` /Annots [${annotIds[i].map(a => a + " 0 R").join(" ")}]` : "";
    obj(p); push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${c} 0 R${an} >>\nendobj\n`);
    const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(c); push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    obj(im); push(`<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.bytes.length} >>\nstream\n`);
    push(j.bytes); push("\nendstream\nendobj\n");
  });
  jpegs.forEach((j, i) => (j.links || []).forEach((l, k) => {
    const sx = PW / W, sy = PH / H;
    const r = [l.x * sx, PH - (l.y + l.h) * sy, (l.x + l.w) * sx, PH - l.y * sy].map(v => v.toFixed(2)).join(" ");
    obj(annotIds[i][k]); push(`<< /Type /Annot /Subtype /Link /Rect [${r}] /Border [0 0 0] /A << /S /URI /URI (${l.url}) >> >>\nendobj\n`);
  }));
  const total = nextAnnot, xref = len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let i = 1; i < total; i++) push(String(offs[i]).padStart(10, "0") + " 00000 n \n");
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out = new Uint8Array(len); let o = 0; for(const b of parts){ out.set(b, o); o += b.length; }
  return out;
}
function canvasToJpeg(cv){
  const b = atob(cv.toDataURL("image/jpeg", 0.92).split(",")[1]); const a = new Uint8Array(b.length);
  for(let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return { bytes: a, w: cv.width, h: cv.height, links: cv.links || [] };
}

/* ---------- flujo ---------- */
function collect(){
  refreshDate();
  const num = pad(parseInt($("#num").value.replace(/\D/g, ""), 10) || 0);
  return {
    num, date: isoToAr($("#date").value), client: $("#client").value.trim(),
    items: items.filter(it => it.desc.trim() || parseNum(it.price)), obs: $("#obs").value,
    wa: $("#wa").value, ig: $("#ig").value, pay: $("#pay").value.trim(), valid: $("#valid").value.trim(), total: grandTotal()
  };
}
function validate(d){
  if(!d.client){ toast("Falta el nombre del cliente."); $("#client").focus(); return false; }
  if(!d.items.length){ toast("Cargá al menos un ítem."); return false; }
  return true;
}
let last = null;
function pvState(mode){
  $("#actsPreview").hidden = mode !== "preview"; $("#actsDone").hidden = mode !== "done";
  $("#btnNew").hidden = true; $("#pvMsg").hidden = mode !== "done";
  $("#pvTitle").textContent = mode === "done" ? "PDF listo" : "Vista previa";
}
async function openPreview(){
  const d = collect(); if(!validate(d)) return;
  const cvs = await renderDoc(d); const body = $("#pvBody"); body.innerHTML = ""; cvs.forEach(c => body.appendChild(c));
  body.scrollTop = 0; pvState("preview"); $("#pv").hidden = false;
}
async function generate(saved){
  const d = saved && saved.num ? saved : collect(); if(!saved && !validate(d)) return;
  const cvs = await renderDoc(d); const body = $("#pvBody"); body.innerHTML = ""; cvs.forEach(c => body.appendChild(c));
  const blob = new Blob([buildPdf(cvs.map(canvasToJpeg))], { type: "application/pdf" });
  const slug = d.client.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  const name = `Cotizacion-${d.date.replace(/\//g, "-")}-${slug || "Cliente"}.pdf`;
  last = { blob, name, file: new File([blob], name, { type: "application/pdf" }) };
  if(!saved){ saveHistory(d); const next = (parseInt(d.num, 10) || 0) + 1; store.set("jt_next", String(next)); $("#num").value = pad(next); }
  $("#pvMsg").innerHTML = `<b>${name}</b> se generó. Descargalo o compartilo.`;
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [last.file] }));
  $("#btnShare").hidden = !canShare; $("#actsDone").classList.toggle("one", !canShare);
  body.scrollTop = 0; pvState("done"); $("#pv").hidden = false;
}
function download(){
  if(!last) return;
  const a = document.createElement("a"); a.href = URL.createObjectURL(last.blob); a.download = last.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  offerNew();
}
function offerNew(){ $("#btnNew").hidden = false; $("#pvMsg").innerHTML = `<b>${last.name}</b> listo. Podés crear una cotización nueva.`; }
async function share(){
  if(!last) return;
  try { await navigator.share({ files: [last.file], title: last.name }); offerNew(); }
  catch(e){ if(e && e.name !== "AbortError") toast("No se pudo abrir compartir. Usá Descargar."); }
}
function resetForm(){
  items = [{ desc: "", qty: "1", price: "" }]; $("#client").value = ""; $("#obs").value = ""; dateTouched = false; refreshDate();
  renderItems(); last = null; $("#pv").hidden = true; window.scrollTo(0, 0);
}
$("#btnPreview").addEventListener("click", openPreview);
$("#btnGen").addEventListener("click", () => generate());
$("#pvGen").addEventListener("click", () => generate());
$("#pvBack").addEventListener("click", () => { $("#pv").hidden = true; });
$("#btnDl").addEventListener("click", download);
$("#btnShare").addEventListener("click", share);
$("#btnNew").addEventListener("click", resetForm);
renderItems();

/* ---------- cotizaciones anteriores ---------- */
const histTitle = e => `${e.client}-${e.date.replace(/\//g, "-")}`;
function loadHistory(){ try { const a = JSON.parse(store.get("jt_hist", "[]")); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
function saveHistory(d){
  const e = { id: Date.now().toString(36), ts: Date.now(), num: d.num, client: d.client, date: d.date, items: d.items, obs: d.obs, pay: d.pay, valid: d.valid, wa: d.wa, ig: d.ig, total: d.total };
  const h = loadHistory();
  h.unshift(e); store.set("jt_hist", JSON.stringify(h)); refreshHistBtn();
}
function refreshHistBtn(){ const n = loadHistory().length; $("#btnHist").textContent = n ? `Cotizaciones anteriores (${n})` : "Cotizaciones anteriores"; }
function renderHistory(){
  const q = $("#histQ").value.trim().toLowerCase(), box = $("#histList");
  const h = loadHistory().filter(e => !q || histTitle(e).toLowerCase().includes(q) || e.num.includes(q));
  box.innerHTML = "";
  if(!h.length){ box.innerHTML = `<p class="hist-empty">${q ? "Sin resultados." : "Todavía no hay cotizaciones guardadas. Se guardan solas al generar el PDF."}</p>`; return; }
  h.forEach(e => {
    const el = document.createElement("div"); el.className = "hi";
    el.innerHTML = '<b class="t"></b><div class="m"><span></span><i></i></div><div class="a"><button class="btn primary" data-a="open" type="button">Abrir PDF</button><button class="btn ghost" data-a="reuse" type="button">Usar de base</button><button class="link" data-a="del" type="button">Borrar</button></div>';
    el.querySelector(".t").textContent = histTitle(e);
    el.querySelector(".m span").textContent = "N° " + e.num; el.querySelector(".m i").textContent = money(e.total);
    el.querySelector('[data-a="open"]').addEventListener("click", () => { $("#hist").hidden = true; generate(e); });
    el.querySelector('[data-a="reuse"]').addEventListener("click", () => reuse(e));
    el.querySelector('[data-a="del"]').addEventListener("click", () => {
      if(!confirm("¿Borrar " + histTitle(e) + "?")) return;
      store.set("jt_hist", JSON.stringify(loadHistory().filter(x => x.id !== e.id))); refreshHistBtn(); renderHistory();
    });
    box.appendChild(el);
  });
}
function reuse(e){
  items = e.items.map(it => ({ desc: it.desc, qty: it.qty, price: it.price }));
  $("#client").value = e.client; $("#obs").value = e.obs || "";
  $("#pay").value = e.pay || $("#pay").value; $("#valid").value = e.valid || $("#valid").value;
  dateTouched = false; refreshDate(); renderItems();
  $("#hist").hidden = true; window.scrollTo(0, 0); toast("Datos cargados. Revisá y generá la nueva cotización.");
}
$("#btnHist").addEventListener("click", () => { $("#histQ").value = ""; renderHistory(); $("#hist").hidden = false; });
$("#histBack").addEventListener("click", () => { $("#hist").hidden = true; });
$("#histQ").addEventListener("input", renderHistory);
refreshHistBtn();

/* modo sin conexión: solo cuando se abre desde la web (no como archivo local) */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
